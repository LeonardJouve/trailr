services:
  neo4j:
    container_name: neo4j
    image: neo4j:2026.06.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_AUTH: neo4j/${DATABASE_PASSWORD}
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins
      - ./neo4j/import:/var/lib/neo4j/import
