apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: api
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: api
        release: {{ .Release.Name }}
    spec:
      initContainers:
        - name: download-tiles
          image: alpine:3.22
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache unzip
              wget -qO /tiles/trails-tiles.zip "$TILES_URL"
              if [ -n "$TILES_SHA256" ]; then
                checksum="${TILES_SHA256#sha256:}"
                echo "$checksum  /tiles/trails-tiles.zip" | sha256sum -c -
              fi
              unzip -oq /tiles/trails-tiles.zip -d /tiles
              rm /tiles/trails-tiles.zip
              test -d /tiles/output/tiles/8
          env:
            - name: TILES_URL
              value: {{ .Values.tiles.url | quote }}
            - name: TILES_SHA256
              value: {{ .Values.tiles.sha256 | quote }}
          volumeMounts:
            - name: tiles
              mountPath: /tiles
      containers:
        - name: api
          image: {{ .Values.apiImage }}
          ports:
            - containerPort: 3000
          env:
            - name: ENVIRONMENT
              value: PRODUCTION
            - name: API_PORT
              value: "3000"
            - name: DATABASE_URI
              value: "bolt://{{ .Release.Name }}-neo4j:7687"
            - name: SOLVER_URI
              value: "{{ .Release.Name }}-solver:3001"
            - name: TILES_DIR
              value: /tiles/output/tiles
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: password
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          volumeMounts:
            - name: tiles
              mountPath: /tiles
              readOnly: true
      volumes:
        - name: tiles
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
    release: {{ .Release.Name }}
spec:
  ports:
    - port: 3000
  selector:
    app: api
    release: {{ .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
    release: {{ .Release.Name }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 3000
