apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: api
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: api
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: api
          image: {{ .Values.apiImage }}
          ports:
            - containerPort: 3000
          env:
            - name: ENVIRONMENT
              value: PRODUCTION
            - name: API_PORT
              value: "3000"
            - name: DATABASE_URI
              value: "bolt://{{ .Release.Name }}-neo4j:7687"
            - name: SOLVER_URI
              value: "{{ .Release.Name }}-solver:3001"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: password
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
    release: {{ .Release.Name }}
spec:
  ports:
    - port: 3000
  selector:
    app: api
    release: {{ .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
    release: {{ .Release.Name }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 3000
