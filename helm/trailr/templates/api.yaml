apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: api
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: api
        release: {{ .Release.Name }}
    spec:
      initContainers:
        - name: download-tiles
          image: alpine:3.22
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # The volume survives container restarts within the pod; the
              # marker is written last, so a partial run starts over.
              [ -f /tiles/.complete ] && exit 0
              find /tiles -mindepth 1 -delete
              apk add --no-cache unzip
              fetch() { # url sha256 destination
                wget -qO /tiles/.download.zip "$1"
                [ -z "$2" ] || echo "${2#sha256:}  /tiles/.download.zip" | sha256sum -c -
                unzip -oq /tiles/.download.zip -d "$3"
                rm /tiles/.download.zip
              }
              fetch "$TILES_URL" "$TILES_SHA256" /tiles/.stage
              mv /tiles/.stage/output/tiles/* /tiles/
              rm -r /tiles/.stage
              [ -z "$CONTOURS_URL" ] || fetch "$CONTOURS_URL" "$CONTOURS_SHA256" /tiles
              test -d /tiles/8
              touch /tiles/.complete
          env:
            - name: TILES_URL
              value: {{ .Values.tilesBootstrap.url | quote }}
            - name: TILES_SHA256
              value: {{ .Values.tilesBootstrap.sha256 | quote }}
            - name: CONTOURS_URL
              value: {{ .Values.contoursBootstrap.url | quote }}
            - name: CONTOURS_SHA256
              value: {{ .Values.contoursBootstrap.sha256 | quote }}
          volumeMounts:
            - name: tiles
              mountPath: /tiles
      containers:
        - name: api
          image: {{ .Values.apiImage }}
          ports:
            - containerPort: 3000
          env:
            - name: ENVIRONMENT
              value: PRODUCTION
            - name: API_PORT
              value: "3000"
            - name: DATABASE_URI
              value: "bolt://{{ .Release.Name }}-neo4j:7687"
            - name: SOLVER_URI
              value: "{{ .Release.Name }}-solver:3001"
            - name: TILES_DIR
              value: /tiles
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: password
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          volumeMounts:
            - name: tiles
              mountPath: /tiles
              readOnly: true
      volumes:
        - name: tiles
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
    release: {{ .Release.Name }}
spec:
  ports:
    - port: 3000
  selector:
    app: api
    release: {{ .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: api
    release: {{ .Release.Name }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 3000
