{{- $neo4jName := include "trailr.componentFullname" (dict "context" . "component" "neo4j" "maxLength" 61) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $neo4jName }}
  labels:
    {{- include "trailr.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
      protocol: TCP
  selector:
    {{- include "trailr.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $neo4jName }}
  labels:
    {{- include "trailr.labels" . | nindent 4 }}
spec:
  serviceName: {{ $neo4jName }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "trailr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: neo4j
  template:
    metadata:
      labels:
        {{- include "trailr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: neo4j
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: neo4j
          image: {{ printf "%s:%s" (required "neo4j.image.repository is required" .Values.neo4j.image.repository) (required "neo4j.image.tag is required" .Values.neo4j.image.tag) | quote }}
          imagePullPolicy: {{ .Values.neo4j.image.pullPolicy | quote }}
          ports:
            - name: bolt
              containerPort: 7687
              protocol: TCP
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret | quote }}
                  key: {{ required "database.usernameKey is required" .Values.database.usernameKey | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret | quote }}
                  key: {{ required "database.passwordKey is required" .Values.database.passwordKey | quote }}
            - name: NEO4J_AUTH
              value: "$(DATABASE_USER)/$(DATABASE_PASSWORD)"
            - name: NEO4J_PLUGINS
              value: '["graph-data-science"]'
          startupProbe:
            tcpSocket:
              port: bolt
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: bolt
          resources:
            {{- toYaml .Values.neo4j.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.neo4j.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.neo4j.storage.size | quote }}
