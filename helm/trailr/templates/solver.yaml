{{- $solverName := include "trailr.componentFullname" (dict "context" . "component" "solver") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $solverName }}
  labels:
    {{- include "trailr.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trailr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: solver
  template:
    metadata:
      labels:
        {{- include "trailr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: solver
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: solver
          image: {{ printf "%s:%s" (required "solver.image.repository is required" .Values.solver.image.repository) (required "solver.image.tag is required" .Values.solver.image.tag) | quote }}
          imagePullPolicy: {{ .Values.solver.image.pullPolicy | quote }}
          ports:
            - name: grpc
              containerPort: 3001
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          resources:
            {{- toYaml .Values.solver.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $solverName }}
  labels:
    {{- include "trailr.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 3001
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "trailr.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: solver
