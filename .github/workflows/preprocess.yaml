name: Preprocess

on:
  push:
    tags:
      - "v[0-9]+.[0-9]*"

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: preprocessor

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Download dataset
        run: |
          mkdir -p data
          wget \
            -O data/wanderwege.gdb.zip \
            "https://data.geo.admin.ch/ch.swisstopo.swisstlm3d-wanderwege/swisstlm3d-wanderwege/swisstlm3d-wanderwege_2056_5728.gdb.zip"

      - name: Install bsdtar
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Extract GDB
        run: |
          bsdtar -xf data/wanderwege.gdb.zip -C data/
          mv data/*.gdb data/SWISSTLM3D_WANDERWEGE.gdb

      - name: Run preprocessor
        run: |
          uv run graph data/swiss3d.json
          mkdir -p output
          for suffix in nodes.csv nodes.gdb edges.csv edges.gdb; do
            mv "data/SWISSTLM3D_WANDERWEGE_${suffix}" "output/wanderwege_${suffix}"
          done

      - name: Download veloland dataset
        run: |
          wget \
            -O data/veloland.gdb.zip \
            "https://data.geo.admin.ch/ch.astra.veloland/veloland/veloland_2056.gdb.zip"

      - name: Extract veloland GDB
        run: |
          mkdir -p data/veloland
          bsdtar -xf data/veloland.gdb.zip -C data/veloland/
          mv data/veloland/*.gdb data/veloland.gdb

      - name: Run veloland preprocessor
        run: |
          uv run graph data/veloland.json
          for suffix in nodes.csv nodes.gdb edges.csv edges.gdb; do
            mv "data/veloland_${suffix}" "output/veloland_${suffix}"
          done

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: trails
          path: preprocessor/output/

      - name: Upload output to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip -r "$RUNNER_TEMP/trails.zip" output/
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG" || \
              gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/trails.zip" --clobber
