name: Preprocess

on:
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: preprocessor

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Download dataset
        run: |
          mkdir -p data
          wget \
            -O data/wanderwege.gdb.zip \
            "https://data.geo.admin.ch/ch.swisstopo.swisstlm3d-wanderwege/swisstlm3d-wanderwege/swisstlm3d-wanderwege_2056_5728.gdb.zip"

      - name: Extract GDB
        run: |
          unzip data/wanderwege.gdb.zip -d data/
          mv data/SWISSTLM3D_WANDERWEGE.gdb data/wanderwege.gdb

      - name: Run preprocessor
        run: |
          mkdir -p output
          uv run graph \
            ./data/wanderwege.gdb \
            ./output \
            TLM_STRASSE

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: trails
          path: preprocessor/output/